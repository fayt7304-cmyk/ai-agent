<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16140f">
  <title>Paul — Offline</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #16140f; color: #f5f0e8; padding: 24px; text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 650; }
    p { margin: 0 0 20px; opacity: 0.75; line-height: 1.5; max-width: 28ch; }
    button {
      border: none; border-radius: 12px; padding: 12px 20px; font-size: 15px;
      font-weight: 600; background: #d8af60; color: #1a1408; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Paul needs a connection for chat. Your installed app shell is still here.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
