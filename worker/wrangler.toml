name = "mistral-agent-chat"
main = "src/index.ts"
compatibility_date = "2026-07-31"

# Workers AI binding — MeloTTS / Deepgram Aura for high-quality TTS when no ElevenLabs key
[ai]
binding = "AI"

# Created with: wrangler d1 create mistral-agent-chat-db
# Then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "mistral-agent-chat-db"
database_id = "fa199031-8adc-4005-a228-c365eef5c515"


[vars]
# Your Mistral Agent's ID from https://console.mistral.ai/build/agents (e.g. "ag:xxxxxxxx").
# Every chat now uses this agent — its model, system instructions, and any tools are
# configured on Mistral's side, not here.
MISTRAL_AGENT_ID = "ag_019fb791c3b87699ab5358b2bc5450dc"
GOOGLE_REDIRECT_URI = "https://api.afmarbre.com/api/auth/google/callback"
RESEND_FROM = "Agent <noreply@afmarbre.com>"
FRONTEND_URL = "https://ai.afmarbre.com"
# Shares the cookie across ai.afmarbre.com and api.afmarbre.com so it survives on mobile
# browsers. Needs api.afmarbre.com added as a custom domain for this Worker in the
# Cloudflare dashboard, and this new redirect URI added in Google Cloud Console.
COOKIE_DOMAIN = ".afmarbre.com"

# Lead capture ("Get a quote" button) emails this address when someone submits
# the form. Uses the same Resend setup as password resets. THIS WAS UNSET, which
# is why quote requests weren't showing up anywhere — replace with your real inbox.
LEAD_NOTIFY_TO = "you@afmarbre.com"

# Optional — caps how many chat messages one user can send per rolling 24h.
# Leave unset for no limit.
# MAX_MESSAGES_PER_DAY = "50"